# Builds the app and publishes dist/ to the gh-pages branch on every push to
# the default branch. GitHub Pages serves that branch, so the live site
# always matches the latest code. Site URL: https://ogennursing-ux.github.io/-/
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/laughing-babbage-n8phwv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
